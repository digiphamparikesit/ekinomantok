<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buku Pengantaran Resep Ruangan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
  :root{
    --paper:#FAF7F0;
    --paper-alt:#F1EBDC;
    --ink:#23281F;
    --muted:#6B6558;
    --line:#DCD5C3;
    --primary:#2F6B52;
    --primary-dark:#1F4A38;
    --gold:#B08628;
    --negative:#B5533C;
    --white:#FFFFFF;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    line-height:1.5;
  }
  .app{
    max-width:920px;
    margin:0 auto;
    padding:32px 20px 64px;
  }
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    border-bottom:2px solid var(--ink);
    padding-bottom:16px;
    margin-bottom:28px;
  }
  header h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:28px;
    margin:0;
    letter-spacing:0.2px;
  }
  header .sub{
    font-size:13px;
    color:var(--muted);
    margin-top:4px;
  }
  .year-picker{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .year-picker label{
    font-size:13px;
    color:var(--muted);
  }
  select, input[type=date], input[type=number], input[type=text]{
    font-family:'Inter', sans-serif;
    font-size:14px;
    padding:9px 12px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--white);
    color:var(--ink);
  }
  select:focus, input:focus{
    outline:2px solid var(--primary);
    outline-offset:1px;
  }
  .year-picker select{
    font-family:'IBM Plex Mono', monospace;
    font-weight:500;
  }
  .icon-btn{
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    width:36px;
    height:36px;
    padding:0;
    border-radius:8px;
    font-size:16px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .icon-btn:hover{
    background:var(--paper-alt);
    color:var(--ink);
    border-color:var(--line);
  }
  .card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:12px;
    padding:20px 22px;
    margin-bottom:24px;
  }
  .card h2{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:16px;
    margin:0 0 16px;
  }
  form.entry-form{
    display:grid;
    grid-template-columns:150px 160px 1fr auto;
    gap:12px;
    align-items:end;
  }
  form.entry-form .field{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  form.entry-form label{
    font-size:12px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.4px;
  }
  button{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14px;
    padding:10px 18px;
    border-radius:var(--radius);
    border:1px solid var(--primary);
    background:var(--primary);
    color:var(--white);
    cursor:pointer;
  }
  button:hover{ background:var(--primary-dark); border-color:var(--primary-dark); }
  button.ghost{
    background:transparent;
    color:var(--negative);
    border:1px solid transparent;
    padding:4px 8px;
    font-weight:500;
    font-size:12px;
  }
  button.ghost:hover{ background:#F6E9E5; }

  .stats-row{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:14px;
    margin-bottom:24px;
  }
  .stat{
    background:var(--paper-alt);
    border-radius:12px;
    padding:16px 18px;
  }
  .stat .label{
    font-size:12px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.4px;
    margin-bottom:6px;
  }
  .stat .value{
    font-family:'IBM Plex Mono', monospace;
    font-size:22px;
    font-weight:500;
  }

  .tape{
    display:flex;
    gap:0;
    overflow-x:auto;
    border-top:1px dashed var(--line);
    border-bottom:1px dashed var(--line);
    padding:4px 0;
  }
  .tape-item{
    flex:1 0 76px;
    text-align:center;
    padding:10px 6px;
    border-right:1px dashed var(--line);
    min-width:76px;
    cursor:pointer;
    border-radius:6px;
    transition:background 0.12s;
  }
  .tape-item:hover{ background:var(--paper-alt); }
  .tape-item:last-child{ border-right:none; }
  .tape-item .month{
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.5px;
    margin-bottom:4px;
  }
  .tape-item .amount{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    font-weight:500;
  }
  .tape-item .amount.zero{ color:var(--muted); }
  .tape-item .amount.neg{ color:var(--negative); }

  .chart-wrap{ position:relative; width:100%; height:260px; margin-top:18px; }

  .month-group{ margin-bottom:18px; }
  .month-group:last-child{ margin-bottom:0; }
  .month-group h3{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    font-weight:500;
    color:var(--primary-dark);
    display:flex;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
    padding-bottom:6px;
    margin:0 0 8px;
  }
  table.entries{
    width:100%;
    border-collapse:collapse;
    font-size:14px;
  }
  table.entries td{
    padding:7px 4px;
    border-bottom:1px solid var(--paper-alt);
    vertical-align:middle;
  }
  table.entries td.date{
    font-family:'IBM Plex Mono', monospace;
    color:var(--muted);
    width:100px;
    white-space:nowrap;
  }
  table.entries td.value{
    font-family:'IBM Plex Mono', monospace;
    text-align:right;
    width:130px;
    white-space:nowrap;
  }
  table.entries td.note{ color:var(--ink); }
  table.entries td.action{ width:50px; text-align:right; }

  .empty{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    padding:24px 0;
  }

  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(35,40,31,0.45);
    align-items:flex-start;
    justify-content:center;
    padding:48px 16px;
    z-index:50;
    overflow-y:auto;
  }
  .modal-overlay.open{ display:flex; }
  .modal-box{
    background:var(--white);
    border-radius:14px;
    max-width:520px;
    width:100%;
    padding:22px 24px;
    border:1px solid var(--line);
  }
  .modal-box .modal-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    border-bottom:1px solid var(--line);
    padding-bottom:12px;
    margin-bottom:14px;
  }
  .modal-box h3{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:18px;
    margin:0 0 4px;
  }
  .modal-box .modal-sub{
    font-size:12px;
    color:var(--muted);
  }
  .modal-box .modal-close{
    background:transparent;
    border:none;
    color:var(--muted);
    font-size:20px;
    line-height:1;
    padding:2px 6px;
    cursor:pointer;
  }
  .modal-box .modal-close:hover{ color:var(--ink); }
  .modal-total{
    font-family:'IBM Plex Mono', monospace;
    font-size:20px;
    font-weight:500;
    margin-bottom:14px;
  }

  @media (max-width:600px){
    form.entry-form{ grid-template-columns:1fr; }
    .stats-row{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div>
      <h1>Buku Pengantaran Resep Ruangan</h1>
      <div class="sub" id="subtitle">Laporan EKIN, direkap per bulan.</div>
    </div>
    <div class="year-picker">
      <label for="profileSelect">Profil</label>
      <select id="profileSelect"></select>
      <label for="yearSelect">Tahun</label>
      <select id="yearSelect"></select>
      <button type="button" id="settingsBtn" class="icon-btn" aria-label="Pengaturan koneksi">⚙</button>
    </div>
  </header>

  <div class="card">
    <h2>Tambah entri</h2>
    <form class="entry-form" id="entryForm">
      <div class="field">
        <label for="inputDate">Tanggal</label>
        <input type="date" id="inputDate" required>
      </div>
      <div class="field">
        <label for="inputValue">Nilai</label>
        <input type="number" id="inputValue" step="any" placeholder="0" required>
      </div>
      <div class="field">
        <label for="inputNote">Catatan (opsional)</label>
        <input type="text" id="inputNote" placeholder="catatan">
      </div>
      <button type="submit">Tambah</button>
    </form>
  </div>

  <div class="stats-row">
    <div class="stat">
      <div class="label">Total tahun ini</div>
      <div class="value" id="statTotal">0</div>
    </div>
    <div class="stat">
      <div class="label">Rata-rata / bulan</div>
      <div class="value" id="statAvg">0</div>
    </div>
    <div class="stat">
      <div class="label">Jumlah entri</div>
      <div class="value" id="statCount">0</div>
    </div>
  </div>

  <div class="card">
    <h2>Rekap per bulan</h2>
    <div class="tape" id="tape"></div>
    <div class="chart-wrap">
      <canvas id="monthChart" role="img" aria-label="Grafik total nilai per bulan untuk tahun terpilih"></canvas>
    </div>
  </div>

  <div class="card">
    <h2>Riwayat</h2>
    <div id="history"></div>
  </div>

</div>

<div class="modal-overlay" id="settingsModal">
  <div class="modal-box">
    <div class="modal-head">
      <div>
        <h3 id="settingsModalTitle">Pengaturan Profil</h3>
        <div class="modal-sub">1 file Google Sheet, tiap profil punya tab sendiri</div>
      </div>
      <button class="modal-close" id="settingsClose" aria-label="Tutup">&times;</button>
    </div>
    <form class="entry-form" id="gsForm" style="grid-template-columns:1fr; gap:14px;">
      <div class="field">
        <label for="inputGsUrl">URL Web App Apps Script (1 URL untuk semua profil)</label>
        <input type="text" id="inputGsUrl" placeholder="https://script.google.com/macros/s/XXXXX/exec">
      </div>
      <div class="field">
        <label for="inputProfileName">Nama Profil (label tampilan)</label>
        <input type="text" id="inputProfileName" placeholder="mis. Petugas 1">
      </div>
      <div class="field">
        <label for="inputSignerName">Nama Pegawai (penandatangan laporan)</label>
        <input type="text" id="inputSignerName" placeholder="mis. Edy Sudiyanto">
      </div>
      <div class="field">
        <label for="inputSignerNip">NIP Pegawai</label>
        <input type="text" id="inputSignerNip" placeholder="mis. 197210102007011050">
      </div>
      <button type="submit">Simpan Profil Ini</button>
    </form>
    <div class="modal-sub" id="gsStatus" style="margin-top:12px;">Belum terhubung.</div>
  </div>
</div>

<div class="modal-overlay" id="monthModal">
  <div class="modal-box">
    <div class="modal-head">
      <div>
        <h3 id="modalTitle">Bulan</h3>
        <div class="modal-sub">Laporan harian</div>
      </div>
      <button class="modal-close" id="modalClose" aria-label="Tutup">&times;</button>
    </div>
    <div class="modal-total" id="modalTotal">0</div>
    <button id="exportExcelBtn" style="margin-bottom:14px;">Unduh Laporan Excel</button>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const MONTH_NAMES = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const MONTH_NAMES_FULL = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
let currentModalMonth = null;
let currentModalYear = null;

// --- Profil (2 user terpisah, masing-masing punya TAB Google Sheet sendiri) ---
const PROFILES_KEY = 'buku-nilai-profiles';
const ACTIVE_PROFILE_KEY = 'buku-nilai-active-profile';
const SHARED_GS_URL_KEY = 'buku-nilai-shared-gs-url';
const DEFAULT_GS_URL = 'https://script.google.com/macros/s/AKfycbwmqbH49GMd0rNsofz5KFO8h2jeE8fleZRQ4CGmo5jiDeReCbw4mgvwB2vln2lPTRej/exec';
const DEFAULT_PROFILES = [
  { id: 'user1', name: 'Om Antok', signerName: 'Om Antok', signerNip: '' },
  { id: 'user2', name: 'Om Jakpar', signerName: 'Om Jakpar', signerNip: '' }
];

let profiles = [];
let activeProfileId = null;
let entries = [];
let chartInstance = null;
let gsUrl = '';

function idify(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function formatNumber(n){
  return Number(n).toLocaleString('id-ID', { maximumFractionDigits: 2 });
}

function setGsStatus(text, isError){
  const el = document.getElementById('gsStatus');
  el.textContent = text;
  el.style.color = isError ? 'var(--negative)' : 'var(--muted)';
}

// Profil & URL disimpan dengan localStorage karena file ini dipakai sebagai file HTML
// mandiri di beberapa perangkat (bukan hanya di dalam sesi Claude).
function loadProfiles(){
  try{
    const raw = localStorage.getItem(PROFILES_KEY);
    profiles = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(DEFAULT_PROFILES));
  }catch(e){
    profiles = JSON.parse(JSON.stringify(DEFAULT_PROFILES));
  }
  try{
    activeProfileId = localStorage.getItem(ACTIVE_PROFILE_KEY) || profiles[0].id;
  }catch(e){
    activeProfileId = profiles[0].id;
  }
  if (!profiles.find(p => p.id === activeProfileId)) activeProfileId = profiles[0].id;

  try{
    const storedUrl = localStorage.getItem(SHARED_GS_URL_KEY);
    gsUrl = storedUrl || DEFAULT_GS_URL;
  }catch(e){
    gsUrl = DEFAULT_GS_URL;
  }
}

function saveProfiles(){
  try{
    localStorage.setItem(PROFILES_KEY, JSON.stringify(profiles));
    localStorage.setItem(ACTIVE_PROFILE_KEY, activeProfileId);
  }catch(e){
    console.error('Gagal menyimpan profil (localStorage tidak tersedia di perangkat ini)', e);
  }
}

function saveSharedGsUrl(url){
  gsUrl = url;
  try{
    localStorage.setItem(SHARED_GS_URL_KEY, url);
  }catch(e){
    console.error('Gagal menyimpan URL (localStorage tidak tersedia di perangkat ini)', e);
  }
}

function getActiveProfile(){
  return profiles.find(p => p.id === activeProfileId) || profiles[0];
}

function populateProfileSelect(){
  const sel = document.getElementById('profileSelect');
  sel.innerHTML = '';
  profiles.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.id;
    opt.textContent = p.name;
    if (p.id === activeProfileId) opt.selected = true;
    sel.appendChild(opt);
  });
}

function openSettingsModal(){
  const p = getActiveProfile();
  document.getElementById('settingsModalTitle').textContent = `Pengaturan Profil — ${p.name}`;
  document.getElementById('inputGsUrl').value = gsUrl || '';
  document.getElementById('inputProfileName').value = p.name;
  document.getElementById('inputSignerName').value = p.signerName || '';
  document.getElementById('inputSignerNip').value = p.signerNip || '';
  document.getElementById('settingsModal').classList.add('open');
}

async function switchProfile(profileId){
  activeProfileId = profileId;
  saveProfiles();
  await loadEntries();
  populateYearSelect(new Date().getFullYear());
  renderAll();
}

// Ambil semua entri dari Google Apps Script (GET), untuk tab profil yang aktif
async function loadEntries(){
  if (!gsUrl){
    entries = [];
    setGsStatus('Belum terhubung. Masukkan URL Web App Apps Script di atas.', true);
    return;
  }
  try{
    setGsStatus('Memuat data dari Google Sheets...');
    const profileParam = encodeURIComponent(activeProfileId);
    const res = await fetch(`${gsUrl}?profile=${profileParam}`, { method: 'GET' });
    const data = await res.json();
    if (data.success){
      entries = data.entries || [];
      setGsStatus('Terhubung (' + getActiveProfile().name + '). ' + entries.length + ' entri dimuat dari Google Sheets.');
    } else {
      entries = [];
      setGsStatus('Gagal memuat: ' + (data.error || 'unknown error'), true);
    }
  }catch(e){
    entries = [];
    setGsStatus('Gagal terhubung ke Apps Script: ' + e.message, true);
  }
}

// Tambah satu entri ke Google Sheets (POST action=add)
async function addEntryToGs(entry){
  if (!gsUrl){ setGsStatus('Belum terhubung ke Apps Script.', true); return false; }
  try{
    const res = await fetch(gsUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // hindari CORS preflight di Apps Script
      body: JSON.stringify({ action: 'add', profile: activeProfileId, date: entry.date, value: entry.value, note: entry.note })
    });
    const data = await res.json();
    if (data.success){
      entry.id = data.id;
      return true;
    }
    setGsStatus('Gagal menambah entri: ' + (data.error || 'unknown error'), true);
    return false;
  }catch(e){
    setGsStatus('Gagal menambah entri: ' + e.message, true);
    return false;
  }
}

// Hapus satu entri di Google Sheets (POST action=delete)
async function deleteEntryFromGs(id){
  if (!gsUrl){ setGsStatus('Belum terhubung ke Apps Script.', true); return false; }
  try{
    const res = await fetch(gsUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'delete', profile: activeProfileId, id: id })
    });
    const data = await res.json();
    if (!data.success){
      setGsStatus('Gagal menghapus entri: ' + (data.error || 'unknown error'), true);
      return false;
    }
    return true;
  }catch(e){
    setGsStatus('Gagal menghapus entri: ' + e.message, true);
    return false;
  }
}

function getYears(){
  const currentYear = new Date().getFullYear();
  const years = new Set(entries.map(e => new Date(e.date).getFullYear()));
  years.add(currentYear);
  return Array.from(years).sort((a,b) => b - a);
}

function populateYearSelect(selected){
  const sel = document.getElementById('yearSelect');
  const years = getYears();
  sel.innerHTML = '';
  years.forEach(y => {
    const opt = document.createElement('option');
    opt.value = y;
    opt.textContent = y;
    if (y === selected) opt.selected = true;
    sel.appendChild(opt);
  });
}

function getSelectedYear(){
  return parseInt(document.getElementById('yearSelect').value, 10);
}

function entriesForYear(year){
  return entries.filter(e => new Date(e.date).getFullYear() === year);
}

function monthlyTotals(year){
  const totals = new Array(12).fill(0);
  entriesForYear(year).forEach(e => {
    const m = new Date(e.date).getMonth();
    totals[m] += Number(e.value);
  });
  return totals;
}

function renderStats(year){
  const yearEntries = entriesForYear(year);
  const total = yearEntries.reduce((s, e) => s + Number(e.value), 0);
  const monthsWithData = new Set(yearEntries.map(e => new Date(e.date).getMonth())).size || 1;
  document.getElementById('statTotal').textContent = formatNumber(total);
  document.getElementById('statAvg').textContent = formatNumber(total / monthsWithData);
  document.getElementById('statCount').textContent = yearEntries.length;
}

function renderTape(year){
  const totals = monthlyTotals(year);
  const tape = document.getElementById('tape');
  tape.innerHTML = '';
  totals.forEach((val, i) => {
    const item = document.createElement('div');
    item.className = 'tape-item';
    const cls = val === 0 ? 'zero' : (val < 0 ? 'neg' : '');
    item.innerHTML = `<div class="month">${MONTH_NAMES[i]}</div><div class="amount ${cls}">${formatNumber(val)}</div>`;
    item.addEventListener('click', () => openMonthReport(i));
    tape.appendChild(item);
  });
}

function renderChart(year){
  const totals = monthlyTotals(year);
  const ctx = document.getElementById('monthChart');
  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: MONTH_NAMES,
      datasets: [{
        label: 'Total per bulan',
        data: totals,
        backgroundColor: '#2F6B52',
        borderRadius: 4,
        maxBarThickness: 28
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: { beginAtZero: true, ticks: { callback: v => formatNumber(v) } },
        x: { grid: { display: false } }
      },
      onClick: (evt, elements) => {
        if (elements.length > 0) openMonthReport(elements[0].index);
      },
      onHover: (evt, elements) => {
        evt.native.target.style.cursor = elements.length ? 'pointer' : 'default';
      }
    }
  });
}

function dailyTotalsForMonth(year, monthIndex, daysInMonth){
  const totals = new Array(daysInMonth).fill(0);
  entriesForYear(year).forEach(e => {
    const d = new Date(e.date);
    if (d.getMonth() === monthIndex){
      totals[d.getDate() - 1] += Number(e.value);
    }
  });
  return totals;
}

async function exportMonthlyExcel(monthIndex, year){
  const profile = getActiveProfile();
  const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
  const totals = dailyTotalsForMonth(year, monthIndex, daysInMonth);
  const capaian = totals.reduce((a, b) => a + b, 0);
  const thinBorder = { top:{style:'thin'}, left:{style:'thin'}, bottom:{style:'thin'}, right:{style:'thin'} };

  const workbook = new ExcelJS.Workbook();
  const sheet = workbook.addWorksheet(MONTH_NAMES_FULL[monthIndex]);
  sheet.views = [{ showGridLines:false }];

  const capaianCol = 3 + daysInMonth;
  const targetCol = 4 + daysInMonth;
  const lastCol = targetCol;

  sheet.mergeCells(1, 1, 1, lastCol);
  const titleCell = sheet.getCell(1, 1);
  titleCell.value = 'REKAPAN PENGANTARAN OBAT & BMHP KE RUANG RAWAT';
  titleCell.font = { name:'Arial', bold:true, size:11, color:{ argb:'FFFFFFFF' } };
  titleCell.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:'FFFF0000' } };
  titleCell.alignment = { horizontal:'center', vertical:'middle' };

  sheet.getCell(3, 1).font = { name:'Arial', bold:true, size:9 };

  const headerRow = 5;
  sheet.getCell(headerRow, 1).value = 'NO';
  sheet.getCell(headerRow, 2).value = 'URAIAN';
  for (let d = 1; d <= daysInMonth; d++){
    sheet.getCell(headerRow, 2 + d).value = d;
  }
  sheet.getCell(headerRow, capaianCol).value = 'CAPAIAN';
  sheet.getCell(headerRow, targetCol).value = 'TARGET';
  for (let col = 1; col <= lastCol; col++){
    const cell = sheet.getCell(headerRow, col);
    cell.font = { name:'Arial', bold:true, size:9 };
    cell.alignment = { horizontal:'center', vertical:'middle', wrapText:true };
    cell.border = thinBorder;
    cell.fill = { type:'pattern', pattern:'solid', fgColor:{ argb: col <= 2 + daysInMonth ? 'FFC6E0B4' : 'FFFFFFFF' } };
  }

  const dataRow = 6;
  sheet.getCell(dataRow, 1).value = 1;
  sheet.getCell(dataRow, 2).value = 'JUMLAH RESEP YANG DI ANTAR';
  sheet.getCell(dataRow, 1).font = { name:'Arial', size:9 };
  sheet.getCell(dataRow, 1).alignment = { horizontal:'center' };
  sheet.getCell(dataRow, 1).border = thinBorder;
  sheet.getCell(dataRow, 2).font = { name:'Arial', size:9 };
  sheet.getCell(dataRow, 2).alignment = { horizontal:'left', wrapText:true };
  sheet.getCell(dataRow, 2).border = thinBorder;

  for (let d = 1; d <= daysInMonth; d++){
    const cell = sheet.getCell(dataRow, 2 + d);
    cell.value = totals[d - 1] || null;
    cell.font = { name:'Arial', size:9 };
    cell.alignment = { horizontal:'center' };
    cell.border = thinBorder;
  }

  const capCell = sheet.getCell(dataRow, capaianCol);
  capCell.value = capaian;
  capCell.font = { name:'Arial', bold:true, size:9, color:{ argb:'FFFF0000' } };
  capCell.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:'FFFFFF00' } };
  capCell.border = thinBorder;
  capCell.alignment = { horizontal:'center' };

  const targetCell = sheet.getCell(dataRow, targetCol);
  targetCell.font = { name:'Arial', bold:true, size:9, color:{ argb:'FFFF0000' } };
  targetCell.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:'FFFFFF00' } };
  targetCell.border = thinBorder;
  targetCell.alignment = { horizontal:'center' };

  const noteRow = dataRow + 2;
  sheet.getCell(noteRow, 1).value = 'Keterangan: kolom TARGET diisi manual sesuai target bulanan.';
  sheet.getCell(noteRow, 1).font = { name:'Arial', italic:true, size:8, color:{ argb:'FF808080' } };

  const signRow = noteRow + 3;
  sheet.getCell(signRow, 2).value = 'Mengetahui,';
  sheet.getCell(signRow, 2).font = { name:'Arial', size:9 };
  sheet.getCell(signRow + 1, 2).value = 'Kepala Instalasi Farmasi';
  sheet.getCell(signRow + 1, 2).font = { name:'Arial', size:9 };
  sheet.getCell(signRow, capaianCol).value = 'Tenggarong Seberang, ......................';
  sheet.getCell(signRow, capaianCol).font = { name:'Arial', size:9 };
  sheet.getCell(signRow + 1, capaianCol).value = 'Pegawai yang bersangkutan';
  sheet.getCell(signRow + 1, capaianCol).font = { name:'Arial', size:9 };

  const nameRow = signRow + 5;
  sheet.getCell(nameRow, 2).value = 'Helen Tapilouw, S.Si.Apt';
  sheet.getCell(nameRow, 2).font = { name:'Arial', bold:true, size:9, underline:true };
  sheet.getCell(nameRow + 1, 2).value = 'NIP.197507202005022003';
  sheet.getCell(nameRow + 1, 2).font = { name:'Arial', size:9 };
  sheet.getCell(nameRow, capaianCol).value = profile.signerName || '......................';
  sheet.getCell(nameRow, capaianCol).font = { name:'Arial', bold:true, size:9, underline:true };
  sheet.getCell(nameRow + 1, capaianCol).value = profile.signerNip ? `NIP.${profile.signerNip}` : '';
  sheet.getCell(nameRow + 1, capaianCol).font = { name:'Arial', size:9 };

  sheet.getColumn(1).width = 5;
  sheet.getColumn(2).width = 26;
  for (let d = 1; d <= daysInMonth; d++) sheet.getColumn(2 + d).width = 4.5;
  sheet.getColumn(capaianCol).width = 10;
  sheet.getColumn(targetCol).width = 10;

  const buffer = await workbook.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type:'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Laporan_Pengantaran_${profile.name.replace(/\s+/g,'_')}_${MONTH_NAMES_FULL[monthIndex]}_${year}.xlsx`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function openMonthReport(monthIndex){
  const year = getSelectedYear();
  currentModalMonth = monthIndex;
  currentModalYear = year;
  const list = entriesForYear(year)
    .filter(e => new Date(e.date).getMonth() === monthIndex)
    .sort((a,b) => new Date(a.date) - new Date(b.date));
  const total = list.reduce((s, e) => s + Number(e.value), 0);

  document.getElementById('modalTitle').textContent = `${MONTH_NAMES[monthIndex]} ${year}`;
  document.getElementById('modalTotal').textContent = formatNumber(total);

  const body = document.getElementById('modalBody');
  if (list.length === 0){
    body.innerHTML = '<div class="empty">Belum ada entri pada bulan ini.</div>';
  } else {
    const rows = list.map(e => `
      <tr>
        <td class="date">${e.date}</td>
        <td class="value">${formatNumber(e.value)}</td>
        <td class="note">${e.note ? escapeHtml(e.note) : ''}</td>
      </tr>`).join('');
    body.innerHTML = `<table class="entries"><tbody>${rows}</tbody></table>`;
  }
  document.getElementById('monthModal').classList.add('open');
}

function closeMonthReport(){
  document.getElementById('monthModal').classList.remove('open');
}
window.openMonthReport = openMonthReport;

function renderHistory(year){
  const container = document.getElementById('history');
  const yearEntries = entriesForYear(year).sort((a,b) => new Date(b.date) - new Date(a.date));
  if (yearEntries.length === 0){
    container.innerHTML = '<div class="empty">Belum ada entri untuk tahun ini.</div>';
    return;
  }
  const byMonth = {};
  yearEntries.forEach(e => {
    const m = new Date(e.date).getMonth();
    if (!byMonth[m]) byMonth[m] = [];
    byMonth[m].push(e);
  });
  const monthKeys = Object.keys(byMonth).sort((a,b) => b - a);
  container.innerHTML = monthKeys.map(m => {
    const list = byMonth[m];
    const subtotal = list.reduce((s, e) => s + Number(e.value), 0);
    const rows = list.map(e => `
      <tr data-id="${e.id}">
        <td class="date">${e.date}</td>
        <td class="value">${formatNumber(e.value)}</td>
        <td class="note">${e.note ? escapeHtml(e.note) : ''}</td>
        <td class="action"><button class="ghost" onclick="deleteEntry('${e.id}')">Hapus</button></td>
      </tr>`).join('');
    return `
      <div class="month-group">
        <h3><span>${MONTH_NAMES[m]} ${year}</span><span>${formatNumber(subtotal)}</span></h3>
        <table class="entries"><tbody>${rows}</tbody></table>
      </div>`;
  }).join('');
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function renderAll(){
  const year = getSelectedYear();
  renderStats(year);
  renderTape(year);
  renderChart(year);
  renderHistory(year);
}

async function deleteEntry(id){
  const ok = await deleteEntryFromGs(id);
  if (!ok) return;
  entries = entries.filter(e => e.id !== id);
  populateYearSelect(getSelectedYear());
  renderAll();
}
window.deleteEntry = deleteEntry;

document.getElementById('yearSelect').addEventListener('change', renderAll);

document.getElementById('profileSelect').addEventListener('change', async (ev) => {
  await switchProfile(ev.target.value);
});

document.getElementById('settingsBtn').addEventListener('click', () => {
  openSettingsModal();
});
document.getElementById('settingsClose').addEventListener('click', () => {
  document.getElementById('settingsModal').classList.remove('open');
});
document.getElementById('settingsModal').addEventListener('click', (ev) => {
  if (ev.target.id === 'settingsModal') document.getElementById('settingsModal').classList.remove('open');
});

document.getElementById('gsForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const url = document.getElementById('inputGsUrl').value.trim();
  const name = document.getElementById('inputProfileName').value.trim();
  const signerName = document.getElementById('inputSignerName').value.trim();
  const signerNip = document.getElementById('inputSignerNip').value.trim();

  saveSharedGsUrl(url);

  const p = getActiveProfile();
  if (name) p.name = name;
  p.signerName = signerName;
  p.signerNip = signerNip;
  saveProfiles();
  populateProfileSelect();

  await loadEntries();
  populateYearSelect(getSelectedYear());
  renderAll();
  document.getElementById('settingsModal').classList.remove('open');
});

document.getElementById('exportExcelBtn').addEventListener('click', () => {
  if (currentModalMonth === null || currentModalYear === null) return;
  exportMonthlyExcel(currentModalMonth, currentModalYear);
});

document.getElementById('modalClose').addEventListener('click', closeMonthReport);
document.getElementById('monthModal').addEventListener('click', (ev) => {
  if (ev.target.id === 'monthModal') closeMonthReport();
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape'){
    closeMonthReport();
    document.getElementById('settingsModal').classList.remove('open');
  }
});

document.getElementById('entryForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const date = document.getElementById('inputDate').value;
  const value = document.getElementById('inputValue').value;
  const note = document.getElementById('inputNote').value.trim();
  if (!date || value === '') return;
  const newEntry = { id: idify(), date, value: Number(value), note };
  const ok = await addEntryToGs(newEntry);
  if (!ok) return;
  entries.push(newEntry);
  document.getElementById('inputValue').value = '';
  document.getElementById('inputNote').value = '';
  const enteredYear = new Date(date).getFullYear();
  populateYearSelect(enteredYear);
  document.getElementById('yearSelect').value = enteredYear;
  renderAll();
});

(async function init(){
  loadProfiles();
  populateProfileSelect();
  await loadEntries();
  const today = new Date();
  document.getElementById('inputDate').value = today.toISOString().slice(0,10);
  populateYearSelect(today.getFullYear());
  renderAll();
})();
</script>
